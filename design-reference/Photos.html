<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding · photos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Instrument+Serif:ital@1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050505;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F4F1EC;-webkit-font-smoothing:antialiased}
a{color:#FFB547}a:hover{color:#FFD08A}
.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.ph{position:absolute;inset:0;overflow:hidden}
.ph-head{position:absolute;left:50%;top:20%;width:34%;aspect-ratio:1/1.18;transform:translateX(-50%);border-radius:50%;background:#150c0f;box-shadow:inset 10px 8px 22px rgba(255,170,90,.22),-8px -6px 30px rgba(255,160,70,.18)}
.ph-body{position:absolute;left:50%;top:52%;width:88%;height:70%;transform:translateX(-50%);border-radius:48% 48% 0 0;background:#150c0f;box-shadow:inset 14px 10px 30px rgba(255,150,80,.16)}
.t1{background:radial-gradient(circle at 18% 16%,rgba(255,181,71,.9) 0,transparent 20%),radial-gradient(circle at 84% 28%,rgba(232,103,42,.7) 0,transparent 16%),radial-gradient(circle at 62% 6%,rgba(255,224,160,.55) 0,transparent 9%),radial-gradient(circle at 8% 52%,rgba(224,64,106,.45) 0,transparent 14%),linear-gradient(180deg,#43200f,#1c0e0c 58%,#0b0808)}
.t3{background:radial-gradient(circle at 70% 20%,rgba(140,90,220,.6) 0,transparent 18%),radial-gradient(circle at 20% 12%,rgba(255,181,71,.7) 0,transparent 16%),linear-gradient(180deg,#24163a,#120c18 58%,#09070b)}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050505;">
  <div aria-hidden="true" style="position: absolute; right: -160px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(245,140,40,.22), transparent 65%); filter: blur(24px);"></div>

  <header style="position: absolute; top: 0; left: 0; right: 0; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="Signup.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #F4F1EC;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font-size: 13px; font-weight: 600; color: rgba(244,241,236,.5);">Step 2 of 4</span>
    </div>
    <div role="progressbar" aria-valuenow="2" aria-valuemin="1" aria-valuemax="4" aria-label="Setup progress" style="display: flex; gap: 6px;">
      <span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #FFB547;"></span>
      <span style="flex-grow: 1; height: 3px; border-radius: 2px; background: #FFB547; box-shadow: 0 0 12px rgba(255,181,71,.6);"></span>
      <span style="flex-grow: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1);"></span>
      <span style="flex-grow: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1);"></span>
    </div>
  </header>

  <section style="position: absolute; left: 24px; right: 24px; top: 128px; display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em;">Show them<br>your <span class="serif" style="font-size: 40px; color: #FFB547;">fit.</span></h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: rgba(244,241,236,.64);">Two or three photos. The first one leads.</p>
  </section>

  <div style="position: absolute; left: 20px; right: 20px; top: 264px; height: 420px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="grid-column: span 2; grid-row: span 2; position: relative; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 20px 50px rgba(0,0,0,.5);">
      <div class="ph t1"><div class="ph-head"></div><div class="ph-body"></div></div>
      <span style="position: absolute; left: 12px; top: 12px; height: 28px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; color: #1A0E05; background: #FFB547;">Primary</span>
      <button aria-label="Remove photo" style="position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); background: rgba(10,10,12,.55); backdrop-filter: blur(16px); color: #F4F1EC; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="position: relative; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,.08);">
      <div class="ph t3" style="filter: brightness(.55);"><div class="ph-head"></div><div class="ph-body"></div></div>
      <div role="progressbar" aria-label="Uploading" aria-valuenow="64" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="#FFB547" stroke-width="3" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="41" transform="rotate(-90 22 22)"></circle></svg>
        <span style="font-size: 12px; font-weight: 600; color: rgba(244,241,236,.8);">64%</span>
      </div>
    </div>
    <button style="border-radius: 20px; border: 1px solid rgba(255,255,255,.08); background: #0F0F12; color: rgba(244,241,236,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-family: inherit;">
      <span style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,181,71,.12); color: #FFB547;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
      <span style="font-size: 13px; font-weight: 600;">Add photo</span>
    </button>
  </div>

  <p style="position: absolute; left: 24px; right: 24px; top: 700px; margin: 0; font-size: 13px; color: rgba(244,241,236,.46); text-align: center;">Hold and drag to reorder · Tap to set as primary</p>

  <footer style="position: absolute; left: 24px; right: 24px; bottom: 34px;">
    <a href="Interests.dc.html" style="height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #1A0E05; text-decoration: none; background: linear-gradient(135deg, #FFC15E, #F08A2C); box-shadow: 0 12px 40px rgba(240,138,44,.3), inset 0 1px 0 rgba(255,255,255,.4);">Continue</a>
  </footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
