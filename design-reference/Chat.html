<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Instrument+Serif:ital@1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050505;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F4F1EC;-webkit-font-smoothing:antialiased}
a{color:inherit}
.serif{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.ph{position:absolute;inset:0;overflow:hidden}
.ph-head{position:absolute;left:50%;top:18%;width:40%;aspect-ratio:1/1.18;transform:translateX(-50%);border-radius:50%;background:#150c0f;box-shadow:inset 6px 5px 12px rgba(255,170,90,.25)}
.ph-body{position:absolute;left:50%;top:60%;width:96%;height:70%;transform:translateX(-50%);border-radius:48% 48% 0 0;background:#150c0f}
.t1{background:radial-gradient(circle at 18% 16%,rgba(255,181,71,.9) 0,transparent 30%),radial-gradient(circle at 84% 28%,rgba(232,103,42,.7) 0,transparent 26%),linear-gradient(180deg,#43200f,#1c0e0c)}
.t3{background:radial-gradient(circle at 70% 20%,rgba(140,90,220,.6) 0,transparent 28%),radial-gradient(circle at 20% 12%,rgba(255,181,71,.7) 0,transparent 26%),linear-gradient(180deg,#24163a,#120c18)}
.ice{height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.09);background:#0F0F12;color:rgba(244,241,236,.86);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .12s ease}
.ice:hover{background:#16161A;border-color:rgba(255,181,71,.35)}
.ice:active{transform:scale(.96)}
.ice:focus-visible,.ib:focus-visible{outline:2px solid #FFB547;outline-offset:2px}
.ib{border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,opacity .15s ease}
.ib:active{transform:scale(.9)}
input::placeholder{color:rgba(244,241,236,.4)}
input:focus{outline:none}
.scroll::-webkit-scrollbar{display:none}
@keyframes msg{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<main style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050505;">
  <div aria-hidden="true" style="position: absolute; left: -160px; bottom: -60px; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(circle, rgba(245,140,40,.14), transparent 65%); filter: blur(24px);"></div>

  <div class="scroll" ref="{{scrollRef}}" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow-y: auto; padding: 96px 16px 104px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;">
    <section style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 0 22px; text-align: center;">
      <div aria-hidden="true" style="display: flex;">
        <span style="position: relative; width: 60px; height: 60px; border-radius: 50%; overflow: hidden; border: 3px solid #050505;"><span class="ph t1"><span class="ph-head"></span><span class="ph-body"></span></span></span>
        <span style="position: relative; width: 60px; height: 60px; margin-left: -16px; border-radius: 50%; overflow: hidden; border: 3px solid #050505;"><span class="ph t3"><span class="ph-head"></span><span class="ph-body"></span></span></span>
      </div>
      <p style="margin: 0; font-size: 14px; color: rgba(244,241,236,.55);">You matched with Ishaan tonight</p>
      <sc-if value="{{showIce}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px;">
          <h2 style="margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">Break the <span class="serif" style="font-size: 26px; color: #FFB547;">ice</span></h2>
          <sc-for list="{{ices}}" as="q" hint-placeholder-count="4">
            <button class="ice" onClick="{{q.send}}">{{q.text}}</button>
          </sc-for>
        </div>
      </sc-if>
    </section>

    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="0">
      <div style="display: flex; flex-direction: column; align-items: {{m.align}}; animation: msg .22s ease both;">
        <div style="max-width: 76%; padding: 11px 15px; border-radius: {{m.radius}}; background: {{m.bg}}; border: {{m.border}}; font-size: 15px; line-height: 1.45; color: #F7F3EE; overflow-wrap: anywhere;">{{m.text}}</div>
        <sc-if value="{{m.showTime}}" hint-placeholder-val="{{ false }}"><span style="margin: 4px 6px 6px; font-size: 11px; color: rgba(244,241,236,.38);">{{m.time}}</span></sc-if>
      </div>
    </sc-for>

    <sc-if value="{{typing}}" hint-placeholder-val="{{ false }}">
      <div aria-label="Ishaan is typing" style="align-self: flex-start; padding: 14px 16px; border-radius: 20px 20px 20px 6px; background: #16161A; border: 1px solid rgba(255,255,255,.06); display: flex; gap: 4px;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #F4F1EC; animation: dot 1s infinite;"></span>
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #F4F1EC; animation: dot 1s .15s infinite;"></span>
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #F4F1EC; animation: dot 1s .3s infinite;"></span>
      </div>
    </sc-if>

    <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
      <section aria-labelledby="connect-h" style="margin: 18px 0 4px; padding: 6px 4px; border-radius: 22px; background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.06); animation: msg .3s ease both;">
        <h3 id="connect-h" style="margin: 10px 14px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(244,241,236,.5);">Connect outside the app</h3>
        <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 44px; text-decoration: none;">
          <span style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(224,64,106,.14); color: #FF8FAB;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor"></circle></svg></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 600;">Instagram</span><span style="font-size: 13px; color: rgba(244,241,236,.55);">@ishaan.moves</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(244,241,236,.5)" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 44px; text-decoration: none; border-top: 1px solid rgba(255,255,255,.05);">
          <span style="width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(90,200,120,.12); color: #7BD99A;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.8 7L4 20l1.1-4A8 8 0 1 1 20 12z"></path></svg></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 600;">WhatsApp</span><span style="font-size: 13px; color: rgba(244,241,236,.55);">Continue chatting</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(244,241,236,.5)" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
        </a>
      </section>
    </sc-if>
  </div>

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 76px; padding: 0 8px; display: flex; align-items: center; gap: 6px; background: rgba(8,8,10,.62); backdrop-filter: blur(24px) saturate(140%); border-bottom: 1px solid rgba(255,255,255,.06);">
    <a href="Matches.dc.html" aria-label="Back to matches" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="position: relative; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0;"><span class="ph t3"><span class="ph-head"></span><span class="ph-body"></span></span></span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; margin-left: 6px;">
      <span style="font-size: 16px; font-weight: 700;">Ishaan</span>
      <span style="font-size: 12px; color: rgba(244,241,236,.5);">Matched tonight</span>
    </span>
    <a href="Sheet.dc.html" aria-label="More options" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: rgba(244,241,236,.8);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></a>
  </header>

  <form onSubmit="{{submit}}" style="position: absolute; left: 12px; right: 12px; bottom: 22px; height: 56px; padding: 6px 6px 6px 20px; box-sizing: border-box; border-radius: 999px; display: flex; align-items: center; gap: 8px; background: rgba(18,18,22,.7); backdrop-filter: blur(24px) saturate(140%); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 16px 50px rgba(0,0,0,.5);">
    <label for="composer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Message</label>
    <input id="composer" autocomplete="off" placeholder="Message…" value="{{draft}}" onChange="{{onDraft}}" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #F4F1EC; font-size: 16px;">
    <button type="submit" class="ib" aria-label="Send" disabled="{{empty}}" style="width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: {{sendBg}}; color: {{sendFg}}; opacity: {{sendOp}};">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
  </form>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { msgs: [], draft: '', typing: false, revealed: false };
    this.el = null;
    this.replies = ['Solid 7. Watch me in the second round.', 'Dance floor, then food stalls. Obviously.', 'Deal. Find me near the main stage.'];
  }
  componentDidUpdate() { if (this.el) this.el.scrollTop = this.el.scrollHeight; }
  send(text) {
    const t = (text || '').trim();
    if (!t) return;
    const msgs = this.state.msgs.concat([{ me: true, text: t, time: 'now' }]);
    this.setState({ msgs, draft: '', typing: true });
    setTimeout(() => {
      const n = this.state.msgs.filter((m) => !m.me).length;
      const reply = this.replies[n % this.replies.length];
      this.setState({ msgs: this.state.msgs.concat([{ me: false, text: reply, time: 'now' }]), typing: false, revealed: this.state.revealed || n >= 0 });
    }, 1300);
  }
  renderVals() {
    const s = this.state;
    const list = s.msgs;
    const msgs = list.map((m, i) => {
      const next = list[i + 1];
      const last = !next || next.me !== m.me;
      return {
        text: m.text, time: m.time, showTime: last,
        align: m.me ? 'flex-end' : 'flex-start',
        bg: m.me ? 'linear-gradient(135deg,#C2481C,#A62A52)' : '#16161A',
        border: m.me ? '0' : '1px solid rgba(255,255,255,.06)',
        radius: m.me ? (last ? '20px 20px 6px 20px' : '20px') : (last ? '20px 20px 20px 6px' : '20px')
      };
    });
    const empty = !s.draft.trim();
    const ices = ['Garba skills from 1–10?', 'What’s your go-to Garba song?', 'Traditional fit ready?', 'Food stalls or dance floor?'].map((text) => ({ text, send: () => this.send(text) }));
    return {
      msgs, ices, showIce: list.length === 0, typing: s.typing, revealed: s.revealed && list.length > 1,
      draft: s.draft, empty,
      sendBg: empty ? 'rgba(255,255,255,.08)' : 'linear-gradient(135deg,#FFC15E,#F08A2C)',
      sendFg: empty ? 'rgba(244,241,236,.5)' : '#1A0E05',
      sendOp: 1,
      scrollRef: (el) => { this.el = el; },
      onDraft: (e) => this.setState({ draft: e.target.value }),
      submit: (e) => { e.preventDefault(); this.send(s.draft); }
    };
  }
}
</script>
</body>
</html>
